name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  clang_format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y clang-format
      - run: scripts/clang-format.sh && git diff --exit-code
  reuse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
