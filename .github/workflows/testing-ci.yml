name: Testing CI
on:
  pull_request:
    branches: [main, testing]
  push:
    branches: [main, testing]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: testing-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y python3 make libglib2.0-bin libglib2.0-dev-bin zip gettext
      - name: Validate and package
        run: python3 .github/scripts/validate.py
